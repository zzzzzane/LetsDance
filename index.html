<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woo - High Definition Scale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden; /* Lock viewport completely */
        }

        /* Fluid wrapper optimized for large, high-res desktop viewports */
        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            max-width: 1920px; /* Prevents extreme stretching on ultra-wides */
            margin: 0 auto;
            padding: 1.5vh 1.5vw;
            box-sizing: border-box;
            gap: 2vh;
            transition: padding-right 0.3s ease;
        }
        
        body.log-open .game-container {
            padding-right: calc(340px + 1.5vw);
        }

        /* Upscaled card dimensions */
        .card {
            height: clamp(90px, 16vh, 170px);
            aspect-ratio: 57 / 87;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.6);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, opacity 0.3s ease;
            user-select: none;
            background-size: cover;
            background-position: center;
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px;
            flex-shrink: 0;
        }

        .card[data-value="1"] { background-image: url('Woo_Cards_57_x_87_mm_01.jpg'), url('Woo_Cards_57_x_87_mm_1.jpg'); }
        .card[data-value="2"] { background-image: url('Woo_Cards_57_x_87_mm_02.jpg'), url('Woo_Cards_57_x_87_mm_2.jpg'); }
        .card[data-value="3"] { background-image: url('Woo_Cards_57_x_87_mm_03.jpg'), url('Woo_Cards_57_x_87_mm_3.jpg'); }
        .card[data-value="4"] { background-image: url('Woo_Cards_57_x_87_mm_04.jpg'), url('Woo_Cards_57_x_87_mm_4.jpg'); }
        .card[data-value="5"] { background-image: url('Woo_Cards_57_x_87_mm_05.jpg'), url('Woo_Cards_57_x_87_mm_5.jpg'); }
        .card[data-value="6"] { background-image: url('Woo_Cards_57_x_87_mm_06.jpg'), url('Woo_Cards_57_x_87_mm_6.jpg'); }
        .card[data-value="7"] { background-image: url('Woo_Cards_57_x_87_mm_07.jpg'), url('Woo_Cards_57_x_87_mm_7.jpg'); }
        .card[data-value="8"] { background-image: url('Woo_Cards_57_x_87_mm_08.jpg'), url('Woo_Cards_57_x_87_mm_8.jpg'); }
        .card[data-value="9"] { background-image: url('Woo_Cards_57_x_87_mm_09.jpg'), url('Woo_Cards_57_x_87_mm_9.jpg'); }

        .card:hover {
            transform: translateY(-12px) scale(1.08);
            box-shadow: 0 16px 28px -4px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            z-index: 50 !important;
        }
        .card.selected {
            transform: translateY(-24px);
            box-shadow: 0 0 0 4px #6366f1, 0 16px 32px -4px rgba(99, 102, 241, 0.6);
            border-color: #818cf8;
            z-index: 40 !important;
        }

        /* Dynamically overlapped fan layout */
        .overlapping-hand {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 30px;
        }
        .overlapping-hand .card {
            margin-left: -2.5vw;
        }
        .overlapping-hand .card:first-child {
            margin-left: 0;
        }

        .board-area {
            min-height: 17vh;
            width: 100%;
            border-radius: 14px;
            border: 2px dashed #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            transition: border-color 0.3s ease;
        }
        .board-area.selectable-zone {
            border-color: #f59e0b;
            background-color: rgba(245, 158, 11, 0.05);
        }
        
        .card-back {
            background-image: url('Woo_Cards_57_x_87_mm_back.jpg');
            background-size: cover;
            background-position: center;
            background-color: #312e81; 
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 0 16px rgba(0,0,0,0.7);
        }
        
        .opponent-hand-container .card-back {
            height: clamp(70px, 12vh, 130px);
            aspect-ratio: 57 / 87;
            margin-left: -2vw;
            pointer-events: none;
            border-radius: 6px;
            box-shadow: -4px 4px 8px rgba(0,0,0,0.6);
            border: 1.5px solid #d97706; 
        }
        .opponent-hand-container .card-back:first-child { margin-left: 0; }
        
        .draw-pile .card-back {
            height: clamp(90px, 16vh, 170px);
            aspect-ratio: 57 / 87;
            border-radius: 8px;
            position: relative;
            box-shadow: 5px 5px 0px #0f172a, 10px 10px 0px #1e293b;
        }
        .draw-pile-count {
            position: absolute;
            bottom: -2.5vh;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            white-space: nowrap;
        }
        .btn {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 700;
            padding: 1vh 2.5vw;
            border-radius: 0.6rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            font-size: clamp(0.8rem, 1.1vw, 1rem);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(0, 0, 0, 0.4);
        }
        .btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        #restart-btn {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            width: 3.5rem;
            height: 3.5rem;
            padding: 0;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            background-color: #334155;
            border: 1px solid #475569;
        }
        .mini-card {
            display: inline-flex;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 4px;
            margin: 0 0.15rem;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 900;
            background-color: #0f172a; 
            border: 1px solid #334155;
        }
        .mini-card[data-value="1"] { color: #ff914d; } 
        .mini-card[data-value="2"] { color: #38b6ff; } 
        .mini-card[data-value="3"] { color: #ff66c4; } 
        .mini-card[data-value="4"] { color: #5271ff; } 
        .mini-card[data-value="5"] { color: #fbc02d; } 
        .mini-card[data-value="6"] { color: #00c2cb; } 
        .mini-card[data-value="7"] { color: #ffde59; } 
        .mini-card[data-value="8"] { color: #7ed957; } 
        .mini-card[data-value="9"] { color: #f8fafc; }
        .mini-card.board-origin { border: 1.5px dashed #f59e0b !important; }
        
        .card-fly {
            position: fixed;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, scale 0.5s ease;
            pointer-events: none;
        }

        /* Screen Shake Mechanics for Bomb Detonations */
        @keyframes shockwave-shake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-8px, 5px) rotate(-1deg); }
            20% { transform: translate(6px, -6px) rotate(1deg); }
            30% { transform: translate(-5px, 2px) rotate(0deg); }
            40% { transform: translate(4px, 4px) rotate(1deg); }
            50% { transform: translate(-3px, -2px) rotate(-1deg); }
            60% { transform: translate(2px, 2px) rotate(0deg); }
            70% { transform: translate(-1px, 1px) rotate(0deg); }
            100% { transform: translate(0, 0); }
        }
        .detonation-shake {
            animation: shockwave-shake 0.6s ease-in-out;
        }

        /* Heart Particle Emitters */
        .love-particle {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
            filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.8));
            animation: eruptParticle 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes eruptParticle {
            0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Flying Box Art Theater Styling */
        .flying-box-art {
            position: fixed;
            width: clamp(150px, 25vh, 280px);
            aspect-ratio: 1080 / 1920;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 99999;
            pointer-events: none;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        #play-log-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 340px;
            background-color: #1e293b;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.7, 0, 0.3, 1);
            z-index: 50;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #334155;
        }
        body.log-open .game-container { padding-right: calc(340px + 1.5vw); }
        body.log-open #play-log-sidebar { transform: translateX(0); }
        .log-entry-wrapper { display: flex; flex-direction: column; margin-bottom: 0.75rem; width: 100%; }
        .log-bubble {
            max-width: 90%;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap; 
            gap: 0.25rem;
        }
        .log-computer { align-self: flex-end; background-color: #334155; color: #f1f5f9; border-bottom-right-radius: 0.1rem; }
        .log-player { align-self: flex-start; background-color: #312e81; color: #f8fafc; border-bottom-left-radius: 0.1rem; border: 1px solid #4338ca; }
        .log-system { align-self: center; color: #ef4444; font-style: normal; font-weight: bold; text-align: center; border-bottom: 1px solid #475569; width: 100%; padding: 0.5rem 0; }
        .log-notice { align-self: center; background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); text-align: center; width: 100%; padding: 0.4rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-slate-950">

    <div id="play-log-sidebar">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-indigo-400 tracking-wide">Theater Play Log</h2>
            <button id="close-log-btn" class="text-2xl text-slate-400 hover:text-rose-400">&times;</button>
        </div>
        <div id="play-log-content" class="flex-grow overflow-y-auto space-y-2 pr-1"></div>
    </div>
    
    <div id="main-layout" class="game-container">
        
        <!-- HEADER -->
        <div class="flex-shrink-0 flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-slate-800/80 backdrop-blur-md">
            <button id="combo-helper-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-full text-xs font-bold transition-all">Meld Catalog ⓘ</button>
            <div class="text-center">
                <h1 id="game-title" class="text-2xl font-black tracking-wider text-slate-100 uppercase leading-none cursor-pointer select-none hover:text-indigo-400 transition-colors">Woo</h1>
                <div id="score-display" class="text-xs font-bold text-indigo-400 mt-1 tracking-widest">PLAYER: 0 • COMPUTER: 0</div>
            </div>
            <button id="play-log-helper-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-1.5 rounded-full text-xs font-bold transition-all">Review Actions ⓘ</button>
        </div>

        <!-- MIDDLEGROUND PLAYSPACE -->
        <div class="flex-grow flex flex-col justify-between gap-3 min-h-0">
            
            <!-- Shared Drafting Deck Setup -->
            <div class="grid grid-cols-4 gap-4 items-center bg-slate-900/20 p-2 rounded-2xl border border-slate-900/40">
                <div class="col-span-1 bg-slate-900/40 p-2 rounded-xl border border-slate-900 flex flex-col items-center justify-center min-h-[19vh]">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Stock Pile</span>
                    <div id="draw-pile" class="draw-pile"></div>
                </div>
                <div class="col-span-3 bg-slate-900/40 p-2 rounded-xl border border-slate-900/80 flex flex-col items-center min-h-[19vh]">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">The Shared Board (Draft Zone)</span>
                    <div id="shared-board" class="board-area"></div>
                </div>
            </div>

            <!-- Enemy Canopy Zone -->
            <div class="bg-slate-900/20 p-2 rounded-2xl border border-slate-900/40 flex flex-col items-center justify-center relative">
                <div class="flex flex-col items-center gap-0.5 mb-1 w-full">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Rival Canopy</span>
                        <span id="opponent-card-count" class="text-[10px] text-indigo-400 font-bold">(13 Cards)</span>
                    </div>
                    <!-- In-house subtle text prompt line for real-time concession alerts -->
                    <div id="rival-ticker" class="text-xs text-amber-400 font-semibold tracking-wide min-h-[1.25rem] transition-all duration-300 opacity-0 transform scale-95"></div>
                </div>
                <div id="opponent-hand" class="opponent-hand-container flex min-h-[13vh] py-1 px-8 justify-center w-full overflow-visible"></div>
            </div>

            <!-- Strut Play Layers -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/30 p-2 rounded-2xl border border-slate-900/60 flex flex-col items-center">
                    <span class="text-[10px] font-bold text-indigo-400/70 uppercase tracking-widest mb-1">Your Displayed Strut</span>
                    <div id="player-trick-area" class="board-area"></div>
                </div>
                <div class="bg-slate-900/30 p-2 rounded-2xl border border-slate-900/60 flex flex-col items-center">
                    <span class="text-[10px] font-bold text-rose-400/70 uppercase tracking-widest mb-1">Rival Displayed Strut</span>
                    <div id="computer-trick-area" class="board-area"></div>
                </div>
            </div>

        </div>

        <!-- FOOTER -->
        <div class="flex-shrink-0 bg-slate-900/50 p-3 rounded-2xl border border-slate-800 flex flex-col items-center justify-center gap-2">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Your Plumage Hand</span>
                <span id="player-card-count" class="text-[10px] text-indigo-400 font-bold">(13 Cards)</span>
            </div>
            
            <div class="w-full overflow-visible py-1 flex justify-center min-h-[18vh]">
                <div id="player-hand" class="overlapping-hand"></div>
            </div>
            
            <p id="status-text" class="text-sm text-slate-300 font-medium h-5 tracking-wide text-center"></p>
            <div id="action-buttons-container" class="flex items-center gap-6">
                <button id="pass-btn" class="btn bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">Pass</button>
                <button id="play-btn" class="btn bg-indigo-600 hover:bg-indigo-500 text-white">Execute Meld</button>
                <button id="next-round-btn" class="btn bg-emerald-600 hover:bg-emerald-500 text-white hidden">Advance Cycle</button>
            </div>
        </div>

    </div>

    <button id="restart-btn" class="btn text-slate-400 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
    </button>

    <script>
        const statusText = document.getElementById('status-text');
        const playerHandElem = document.getElementById('player-hand');
        const opponentHandElem = document.getElementById('opponent-hand');
        const playerCardCountElem = document.getElementById('player-card-count');
        const opponentCardCountElem = document.getElementById('opponent-card-count');
        const sharedBoardElem = document.getElementById('shared-board');
        const drawPileElem = document.getElementById('draw-pile');
        const playBtn = document.getElementById('play-btn');
        const passBtn = document.getElementById('pass-btn');
        const nextRoundBtn = document.getElementById('next-round-btn');
        const restartBtn = document.getElementById('restart-btn');
        const playerTrickAreaElem = document.getElementById('player-trick-area');
        const computerTrickAreaElem = document.getElementById('computer-trick-area');
        const scoreDisplayElem = document.getElementById('score-display');
        const playLogContentElem = document.getElementById('play-log-content');
        const mainLayoutElem = document.getElementById('main-layout');
        const rivalTickerElem = document.getElementById('rival-ticker');
        const gameTitleElem = document.getElementById('game-title');

        let playerHand, computerHand, drawDeck, sharedBoard, selectedHandCards, selectedBoardCards, currentPlayer, lastPlayedCombo, isPassing, isSinglesMode;
        let playerTrickPlay, computerTrickPlay, playerScore = 0, computerScore = 0, lastRoundWinner = null, playLog = [];
        let tickerTimeout = null;
        let titleClickCount = 0;
        
        function createDeck() {
            const deck = []; let id = 0;
            for (let i = 1; i <= 9; i++) { for (let j = 0; j < 6; j++) { deck.push({ value: i, id: id++ }); } }
            return deck;
        }
        function shuffleDeck(deck) {
            for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
        }
        function startGame() { playerScore = 0; computerScore = 0; lastRoundWinner = null; playLog = []; startRound(); }

        function startRound() {
            addToLog(`--- Cycle Round ${playerScore + computerScore + 1} ---`);
            const deck = createDeck(); shuffleDeck(deck);
            playerHand = deck.splice(0, 13).sort((a,b) => a.value - b.value);
            computerHand = deck.splice(0, 13).sort((a,b) => a.value - b.value);
            sharedBoard = deck.splice(0, 4); drawDeck = deck;
            selectedHandCards = []; selectedBoardCards = []; lastPlayedCombo = null;
            currentPlayer = lastRoundWinner === null ? (Math.random() < 0.5 ? 'player' : 'computer') : (lastRoundWinner === 'player' ? 'computer' : 'player');
            isPassing = false; isSinglesMode = false; playerTrickPlay = []; computerTrickPlay = [];
            playBtn.classList.remove('hidden'); passBtn.classList.remove('hidden'); nextRoundBtn.classList.add('hidden');
            renderAll();
            updateStatus(`${currentPlayer === 'player' ? 'Your lead!' : 'Rival preparing strategy...'}`);
            if (currentPlayer === 'computer') { disableControls(); setTimeout(computerTurn, 1200); }
        }

        function disableControls() { playBtn.disabled = true; passBtn.disabled = true; }
        
        function triggerConcessionNotice(msg, triggerSidebar = false) {
            playLog.push({ message: msg, cards: [], type: 'notice' });
            renderPlayLog();
            if (triggerSidebar) {
                document.body.classList.add('log-open');
            }
        }

        /* Displays inline ticker information inside the Enemy Canopy zone */
        function flashRivalTickerMessage(msg) {
            if (tickerTimeout) clearTimeout(tickerTimeout);
            rivalTickerElem.textContent = msg;
            rivalTickerElem.classList.remove('opacity-0', 'scale-95');
            rivalTickerElem.classList.add('opacity-100', 'scale-100');
            
            tickerTimeout = setTimeout(() => {
                rivalTickerElem.classList.remove('opacity-100', 'scale-100');
                rivalTickerElem.classList.add('opacity-0', 'scale-95');
            }, 2500);
        }

        /* Flight Theater Engine for Woo_Cards_Box.jpg */
        function launchFlyingBoxArt() {
            const img = document.createElement('img');
            img.src = 'Woo_Cards_Box.jpg';
            img.className = 'flying-box-art';
            
            let posX = window.innerWidth / 2 - 100;
            let posY = window.innerHeight / 2 - 150;
            let velX = (Math.random() * 12 + 8) * (Math.random() < 0.5 ? 1 : -1);
            let velY = (Math.random() * 12 + 8) * (Math.random() < 0.5 ? 1 : -1);
            let rotation = 0;
            let rotVel = Math.random() * 4 + 2;

            img.style.left = `0px`;
            img.style.top = `0px`;
            img.style.transform = `translate(${posX}px, ${posY}px) rotate(${rotation}deg)`;
            document.body.appendChild(img);

            const startTime = performance.now();
            
            function updatePhysics(timestamp) {
                const elapsed = timestamp - startTime;
                
                posX += velX;
                posY += velY;
                rotation += rotVel;

                const imgWidth = img.offsetWidth || 200;
                const imgHeight = img.offsetHeight || 350;

                if (posX <= 0 || posX + imgWidth >= window.innerWidth) {
                    velX *= -1;
                    rotVel *= -1;
                    posX = Math.max(0, Math.min(posX, window.innerWidth - imgWidth));
                }
                if (posY <= 0 || posY + imgHeight >= window.innerHeight) {
                    velY *= -1;
                    posY = Math.max(0, Math.min(posY, window.innerHeight - imgHeight));
                }

                img.style.transform = `translate(${posX}px, ${posY}px) rotate(${rotation}deg)`;

                if (elapsed < 4500) {
                    requestAnimationFrame(updatePhysics);
                } else if (elapsed < 5000) {
                    img.style.opacity = (1 - (elapsed - 4500) / 500);
                    requestAnimationFrame(updatePhysics);
                } else {
                    img.remove();
                }
            }
            
            requestAnimationFrame(updatePhysics);
        }

        /* Tactical Detonation Effects Engine */
        function detonateLoveBombVFX() {
            mainLayoutElem.classList.remove('detonation-shake');
            void mainLayoutElem.offsetWidth; 
            mainLayoutElem.classList.add('detonation-shake');
            
            const heartIcons = ['💖', '💥', '💟', '🔥', '❤️'];
            const burstX = window.innerWidth / 2;
            const burstY = window.innerHeight / 2;
            
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'love-particle';
                p.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                p.style.left = `${burstX}px`;
                p.style.top = `${burstY}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 320;
                p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                p.style.setProperty('--rot', `${-180 + Math.random() * 360}deg`);
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function renderAll() {
            renderPlayerHand(); renderOpponentHand(); renderSharedBoard(); renderDrawPile(); renderTrickAreas();
            scoreDisplayElem.textContent = `PLAYER: ${playerScore} • COMPUTER: ${computerScore}`;
            renderPlayLog(); updateContextualControls();
        }

        function updateContextualControls() {
            sharedBoardElem.classList.remove('selectable-zone');
            if (currentPlayer !== 'player') { disableControls(); return; }

            playBtn.disabled = false;
            passBtn.disabled = false;

            if (isPassing) { 
                passBtn.textContent = 'Skip Draft'; 
                if (sharedBoard.length > 0) sharedBoardElem.classList.add('selectable-zone'); 
                playBtn.disabled = true; 
                return; 
            }

            const boardIsEmpty = (sharedBoard.length === 0);
            
            if (!lastPlayedCombo) {
                const canPlayCombo = checkValidCombinationsExist(playerHand, sharedBoard);
                if (boardIsEmpty || (!canPlayCombo && !isSinglesMode)) {
                    passBtn.textContent = 'Initiate Singles';
                } else {
                    passBtn.textContent = 'Pass';
                    passBtn.disabled = isSinglesMode;
                }
            } else { 
                passBtn.textContent = 'Concede/Pass'; 
            }
        }

        function animateCardMovement(startElement, destinationElement, cardData = null) {
            if (!startElement || !destinationElement) return;
            const clone = cardData ? createCardElement(cardData) : startElement.cloneNode(true);
            const startRect = startElement.getBoundingClientRect(); const destRect = destinationElement.getBoundingClientRect();
            clone.classList.add('card-fly'); clone.style.left = `${startRect.left}px`; clone.style.top = `${startRect.top}px`;
            document.body.appendChild(clone);
            
            if (startElement && startElement !== opponentHandElem) startElement.style.opacity = '0';
            
            requestAnimationFrame(() => {
                const deltaX = destRect.left + (destRect.width / 2) - (startRect.width / 2); const deltaY = destRect.top + (destRect.height / 2) - (startRect.height / 2);
                clone.style.transform = `translate(${deltaX - startRect.left}px, ${deltaY - startRect.top}px) scale(0.5)`; clone.style.opacity = '0.3';
            });
            setTimeout(() => clone.remove(), 500);
        }

        function renderPlayLog() {
            playLogContentElem.innerHTML = playLog.map(entry => {
                if (entry.type === 'notice') {
                    return `<div class="log-entry-wrapper"><div class="log-bubble log-notice"><strong>${entry.message}</strong></div></div>`;
                }
                const cardHTML = [...entry.cards].sort((a,b)=>a.value-b.value).map(c => `<div class="mini-card ${c.fromBoard ? 'board-origin' : ''}" data-value="${c.value}">${c.value}</div>`).join('');
                let bClass = entry.message.includes('Rival') ? 'log-computer' : (entry.message.includes('You') ? 'log-player' : 'log-system');
                return `<div class="log-entry-wrapper"><div class="log-bubble ${bClass}"><strong>${entry.message}</strong> ${cardHTML}</div></div>`;
            }).join('');
            playLogContentElem.scrollTop = playLogContentElem.scrollHeight;
        }
        function addToLog(message, cards = []) { playLog.push({ message, cards }); renderPlayLog(); }
        
        function renderPlayerHand() {
            playerHandElem.innerHTML = ''; 
            playerHand.forEach((card, idx) => {
                const cardEl = createCardElement(card, 'hand');
                cardEl.style.zIndex = idx + 1;
                playerHandElem.appendChild(cardEl);
            });
            playerCardCountElem.textContent = `(${playerHand.length} Cards)`;
        }
        
        function renderOpponentHand() {
            opponentHandElem.innerHTML = ''; 
            opponentHandElem.style.opacity = '1';
            opponentCardCountElem.textContent = `(${computerHand.length} Cards)`;
            for(let i = 0; i < computerHand.length; i++) { 
                const back = document.createElement('div'); 
                back.className = 'card-back'; 
                back.style.zIndex = i + 1;
                opponentHandElem.appendChild(back); 
            }
        }
        
        function renderSharedBoard() { sharedBoardElem.innerHTML = ''; sharedBoard.forEach(card => sharedBoardElem.appendChild(createCardElement(card, 'board'))); }
        function renderDrawPile() {
            drawPileElem.innerHTML = '';
            if (drawDeck.length > 0) { const back = document.createElement('div'); back.className = 'card-back'; back.innerHTML = `<div class="draw-pile-count">${drawDeck.length} LEFT</div>`; drawPileElem.appendChild(back); }
            else { drawPileElem.innerHTML = `<div class="text-xs font-bold text-slate-600">DEPLETED</div>`; }
        }
        function renderTrickAreas() {
            playerTrickAreaElem.innerHTML = ''; playerTrickPlay.slice().sort((a,b)=>a.value-b.value).forEach(c => playerTrickAreaElem.appendChild(createCardElement(c)));
            computerTrickAreaElem.innerHTML = ''; computerTrickPlay.slice().sort((a,b)=>a.value-b.value).forEach(c => computerTrickAreaElem.appendChild(createCardElement(c)));
        }

        /* Stripped of fallback rendering completely—images are on their own now. */
        function createCardElement(card, mode = 'view') {
            const div = document.createElement('div'); 
            div.className = 'card'; 
            div.dataset.value = card.value; 
            div.dataset.id = card.id;

            if (mode === 'hand' && selectedHandCards.some(c => c.id === card.id)) div.classList.add('selected');
            if (mode === 'board' && selectedBoardCards.some(c => c.id === card.id)) div.classList.add('selected');
            
            div.addEventListener('click', () => {
                if (currentPlayer !== 'player') return;
                if (isPassing) { if (mode === 'board') draftPassedCard(card); return; }
                if (mode === 'hand') {
                    const idx = selectedHandCards.findIndex(c => c.id === card.id);
                    if (idx > -1) selectedHandCards.splice(idx, 1); else if (selectedHandCards.length < 4) selectedHandCards.push(card);
                } else if (mode === 'board') {
                    const idx = selectedBoardCards.findIndex(c => c.id === card.id);
                    if (idx > -1) selectedBoardCards.splice(idx, 1); else if (selectedBoardCards.length < 4) selectedBoardCards.push(card);
                }
                renderAll();
            });
            return div;
        }
        function updateStatus(msg) { statusText.textContent = msg; }

        function draftPassedCard(card) {
            isPassing = false;
            triggerConcessionNotice(`You conceded the trick and drafted card [${card.value}] from the board.`, false);
            animateCardMovement(document.querySelector(`#shared-board .card[data-id='${card.id}']`), playerHandElem);
            playerHand.push(card); playerHand.sort((a,b) => a.value - b.value);
            sharedBoard = sharedBoard.filter(c => c.id !== card.id);
            setTimeout(() => {
                if (drawDeck.length > 0) sharedBoard.push(drawDeck.pop());
                cleanTrickArena();
                currentPlayer = 'computer'; 
                renderAll();
                updateStatus("Rival preparing new lead strategy...");
                setTimeout(computerTurn, 1200);
            }, 600);
        }

        function cleanTrickArena() { lastPlayedCombo = null; playerTrickPlay = []; computerTrickPlay = []; isSinglesMode = false; }

        function evaluateMeldStructure(cards) {
            if (!cards.length) return { type: 'invalid' };
            const sorted = cards.map(c => c.value).sort((a,b) => a - b); const len = sorted.length;
            if (len === 1) return { type: 'Single', value: sorted[0], cards };
            if (sorted.every(v => v === sorted[0])) {
                if (len === 2) return { type: 'Pair', value: sorted[0], cards };
                if (len === 3) return { type: 'Triple', value: sorted[0], cards };
                if (len === 4) return { type: 'Bomb', value: sorted[0], cards };
            }
            if (len === 4 && sorted[0] === sorted[1] && sorted[2] === sorted[3] && sorted[2] === sorted[0] + 1) return { type: 'Stairs', value: sorted[3], cards };
            if (len >= 2 && len <= 4 && sorted.every((v, i) => i === 0 || v === sorted[i-1] + 1)) return { type: `${len}-Run`, value: sorted[len-1], cards };
            return { type: 'invalid', cards };
        }

function verifyMeldLegality(attempt, currentActive, handCount, boardCount) {
    if (attempt.type === 'invalid') return "Invalid meld structural layout.";
    
    // 1. Handle Bomb Logic (Bombs ignore normal Singles rules)
    if (attempt.type === 'Bomb') {
        if (sharedBoard.length > 0 && (handCount === 0 || boardCount === 0)) return "Love Bombs require components from both systems.";
        if (currentActive && currentActive.type === 'Bomb' && attempt.value <= currentActive.value) return `Rival Bomb rank is dominant. Must surpass ${currentActive.value}.`;
        return null;
    }
    
    // 2. Handle Singles Mode Logic
    if (isSinglesMode) {
        if (attempt.type !== 'Single') return "Singles constraint active. Match rank or detonate Love Bomb.";
        if (handCount + boardCount !== 1) return "Select exactly 1 card.";
        if (currentActive && attempt.value <= currentActive.value) return `Rank too low. Must surpass ${currentActive.value}.`;
        return null; // Bypasses the linking rule below entirely!
    }
    
    // 3. Handle Standard Complex Combination Rules
    if (sharedBoard.length === 0) {
        if (attempt.type !== 'Single') return "Board depleted. Lead requires single card play format.";
        return null;
    }

    // This check is now correctly restricted ONLY to normal complex combo matching
    if (handCount === 0 || boardCount === 0) return "Melds must link both hand cards and shared board cards.";
    if (!currentActive) { if (attempt.type === 'Single') return "Opening lead requires complex combo composition."; return null; }
    if (currentActive.type === 'Bomb') return "Love Bomb detonation active. Counter-bomb required.";
    if (attempt.type !== currentActive.type) return `Meld shape mismatch. Expected matching ${currentActive.type}.`;
    if (attempt.value <= currentActive.value) return `Insufficient rank power. Must beat value ${currentActive.value}.`;
    return null;
}

        function playTurn() {
            if (currentPlayer !== 'player' || isPassing) return;
            const compiled = [...selectedHandCards, ...selectedBoardCards.map(c => ({...c, fromBoard: true}))];
            if (!compiled.length) { updateStatus("No cards prepared for play."); return; }
            const attemptMeld = evaluateMeldStructure(compiled);
            const failureReason = verifyMeldLegality(attemptMeld, lastPlayedCombo, selectedHandCards.length, selectedBoardCards.length);
            if (failureReason) { updateStatus(failureReason); return; }
            
            selectedHandCards.forEach(c => animateCardMovement(document.querySelector(`#player-hand .card[data-id='${c.id}']`), playerTrickAreaElem));
            selectedBoardCards.forEach(c => animateCardMovement(document.querySelector(`#shared-board .card[data-id='${c.id}']`), playerTrickAreaElem));
            setTimeout(() => {
                addToLog("You introduced a " + attemptMeld.type, attemptMeld.cards);
                
                if (attemptMeld.type === 'Bomb') { 
                    detonateLoveBombVFX(); 
                    if (attemptMeld.value === 9) { launchFlyingBoxArt(); }
                }
                
                playerHand = playerHand.filter(c => !selectedHandCards.some(s => s.id === c.id));
                sharedBoard = sharedBoard.filter(c => !selectedBoardCards.some(s => s.id === c.id));
                for (let i = 0; i < selectedBoardCards.length; i++) { if (drawDeck.length > 0) sharedBoard.push(drawDeck.pop()); }
                lastPlayedCombo = attemptMeld; playerTrickPlay = attemptMeld.cards;
                selectedHandCards = []; selectedBoardCards = [];
                if (playerHand.length === 0) { roundTermination('player'); return; }
                switchTurn();
            }, 550);
        }

        function switchTurn() {
            currentPlayer = currentPlayer === 'player' ? 'computer' : 'player';
            if (lastPlayedCombo) { isSinglesMode = (lastPlayedCombo.type === 'Single'); }
            if (sharedBoard.length === 0 && !lastPlayedCombo) { isSinglesMode = true; }
            
            renderAll();
            if (currentPlayer === 'computer') { disableControls(); updateStatus("Rival analyzing structural weaknesses..."); setTimeout(computerTurn, 1200); }
            else { updateStatus(!lastPlayedCombo ? (sharedBoard.length === 0 ? "Board depleted! Play a single to lead." : "Your lead!") : "Your opportunity to counter."); }
        }

        function passTurn() {
            if (currentPlayer !== 'player') return;
            
            if (isPassing || passBtn.textContent === 'Skip Draft') {
                triggerConcessionNotice(`You skipped the draft phase.`, false); 
                isPassing = false; 
                cleanTrickArena();
                currentPlayer = 'computer'; 
                renderAll(); 
                updateStatus("Rival preparing new lead strategy..."); 
                setTimeout(computerTurn, 1200);
                return;
            }
            
            if (isSinglesMode || lastPlayedCombo) {
                if (sharedBoard.length === 0) {
                    triggerConcessionNotice(`You passed (No card to draft).`, false); 
                    cleanTrickArena();
                    currentPlayer = 'computer'; 
                    renderAll(); 
                    updateStatus("Rival preparing new lead strategy..."); 
                    setTimeout(computerTurn, 1200);
                    return;
                }
                isPassing = true; 
                selectedHandCards = []; 
                selectedBoardCards = [];
                updateStatus("Concession acknowledged. Select one card from Board to claim, or skip."); 
                renderAll(); 
                return;
            }
            
            if (passBtn.textContent === 'Initiate Singles') { 
                isSinglesMode = true; 
                cleanTrickArena(); 
                addToLog(`You altered posture to Singles Mode.`); 
                renderAll();
                updateStatus("Singles Mode active. Select and play your single card lead.");
            }
        }

        function computerTurn() {
            if (sharedBoard.length === 0 && !lastPlayedCombo) { isSinglesMode = true; }
            if (isSinglesMode) { executeComputerSinglesLogic(); return; }
            
            let selection = findOptimalComputerMove(); if (selection) { deployComputerMeld(selection); return; }
            let nuclearOption = findComputerLoveBomb(); if (nuclearOption) { deployComputerMeld(nuclearOption); return; }
            if (!lastPlayedCombo) { isSinglesMode = true; addToLog(`Rival initiated Singles Protocol.`); executeComputerSinglesLogic(); return; }
            executeComputerConcession();
        }

        function deployComputerMeld(move) {
            move.handCards.forEach(c => animateCardMovement(opponentHandElem, computerTrickAreaElem, c));
            move.boardCards.forEach(c => animateCardMovement(document.querySelector(`#shared-board .card[data-id='${c.id}']`), computerTrickAreaElem));
            setTimeout(() => {
                const combined = [...move.handCards, ...move.boardCards.map(c => ({...c, fromBoard: true}))];
                addToLog("Rival deployed " + move.meld.type, combined);
                
                if (move.meld.type === 'Bomb') { 
                    detonateLoveBombVFX(); 
                    if (move.meld.value === 9) { launchFlyingBoxArt(); }
                }
                
                computerHand = computerHand.filter(c => !move.handCards.some(s => s.id === c.id));
                sharedBoard = sharedBoard.filter(c => !move.boardCards.some(s => s.id === c.id));
                for (let i = 0; i < move.boardCards.length; i++) { if (drawDeck.length > 0) sharedBoard.push(drawDeck.pop()); }
                lastPlayedCombo = move.meld; computerTrickPlay = move.meld.cards;
                if (computerHand.length === 0) { roundTermination('computer'); return; }
                switchTurn();
            }, 550);
        }

        function executeComputerSinglesLogic() {
            const choices = [...computerHand.map(c => ({...c, loc: 'hand'})), ...sharedBoard.map(c => ({...c, loc: 'board'}))].filter(c => !lastPlayedCombo || c.value > lastPlayedCombo.value);
            if (choices.length > 0) {
                choices.sort((a,b) => a.value - b.value); let picked = choices[0];
                const node = picked.loc === 'board' ? document.querySelector(`#shared-board .card[data-id='${picked.id}']`) : opponentHandElem;
                animateCardMovement(node, computerTrickAreaElem, picked);
                setTimeout(() => {
                    addToLog(`Rival played Single`, [picked.loc === 'board' ? {...picked, fromBoard: true} : picked]);
                    if (picked.loc === 'hand') { computerHand = computerHand.filter(c => c.id !== picked.id); }
                    else { sharedBoard = sharedBoard.filter(c => c.id !== picked.id); if (drawDeck.length > 0) sharedBoard.push(drawDeck.pop()); }
                    lastPlayedCombo = { type: 'Single', value: picked.value, cards: [picked] }; computerTrickPlay = [picked];
                    if (computerHand.length === 0) { roundTermination('computer'); return; }
                    switchTurn();
                }, 550);
            } else {
                let nuclearOption = findComputerLoveBomb(); if (nuclearOption) { deployComputerMeld(nuclearOption); return; }
                executeComputerConcession();
            }
        }

        function executeComputerConcession() {
            let targetCard = null;
            if (sharedBoard.length > 0) {
                const tallies = {}; computerHand.forEach(c => tallies[c.value] = (tallies[c.value] || 0) + 1);
                let profiles = [...sharedBoard].sort((a,b) => (tallies[b.value] || 0) - (tallies[a.value] || 0)); targetCard = profiles[0];
            }
            if (targetCard) { animateCardMovement(document.querySelector(`#shared-board .card[data-id='${targetCard.id}']`), opponentHandElem); }
            
            setTimeout(() => {
                let statusMsg = "";
                if (targetCard) {
                    statusMsg = `Conceded! Drafted [${targetCard.value}] from board.`;
                    triggerConcessionNotice(`Rival conceded the trick and drafted card [${targetCard.value}] from the board.`, false);
                    computerHand.push(targetCard); computerHand.sort((a,b)=>a.value-b.value);
                    sharedBoard = sharedBoard.filter(c => c.id !== targetCard.id); if (drawDeck.length > 0) sharedBoard.push(drawDeck.pop());
                } else { 
                    statusMsg = `Passed the trick entirely.`;
                    triggerConcessionNotice(`Rival passed the trick entirely.`, false);
                }
                cleanTrickArena();
                currentPlayer = 'player'; 
                renderAll();
                updateStatus(sharedBoard.length === 0 ? "Board empty! Play a single from your hand to lead." : "Your lead!");
                
                flashRivalTickerMessage(statusMsg);
            }, 600);
        }

        function findOptimalComputerMove() {
            if (sharedBoard.length === 0) return null;
            const options = []; const hSub = getPowerset(computerHand, 4); const bSub = getPowerset(sharedBoard, 3);
            for (const h of hSub) {
                if (!h.length) continue;
                for (const b of bSub) {
                    if (!b.length) continue; const composite = [...h, ...b]; const testMeld = evaluateMeldStructure(composite);
                    if (testMeld.type === 'invalid' || testMeld.type === 'Bomb') continue;
                    if (!verifyMeldLegality(testMeld, lastPlayedCombo, h.length, b.length)) { options.push({ meld: testMeld, handCards: h, boardCards: b, val: testMeld.value }); }
                }
            }
            if (!options.length) return null; options.sort((a,b) => a.val - b.val); return options[0];
        }
        function findComputerLoveBomb() {
            const hSub = getPowerset(computerHand, 4); const bSub = getPowerset(sharedBoard, 3);
            for (const h of hSub) {
                if (!h.length) continue;
                if (sharedBoard.length === 0) {
                    if (h.length === 4) {
                        const testMeld = evaluateMeldStructure(h);
                        if (testMeld.type === 'Bomb' && !verifyMeldLegality(testMeld, lastPlayedCombo, h.length, 0)) return { meld: testMeld, handCards: h, boardCards: [] };
                    }
                    continue;
                }
                for (const b of bSub) {
                    if (!b.length) continue; const composite = [...h, ...b]; if (composite.length !== 4) continue;
                    const testMeld = evaluateMeldStructure(composite);
                    if (testMeld.type === 'Bomb' && !verifyMeldLegality(testMeld, lastPlayedCombo, h.length, b.length)) { return { meld: testMeld, handCards: h, boardCards: b }; }
                }
            }
            return null;
        }
        function getPowerset(array, maxLen) {
            const grab = (curr, index) => { if (curr.length === len) { output.push(curr); return; } for (let i = index; i < array.length; i++) grab([...curr, array[i]], i + 1); };
            const output = []; let len = 1; for (let i = 1; i <= Math.min(array.length, maxLen); i++) { len = i; grab([], 0); } return output;
        }
        function checkValidCombinationsExist(hand, board) {
            if (board.length === 0) return false;
            for (let i = 1; i <= Math.min(hand.length, 4); i++) {
                const subH = getSubsetsFixed(hand, i);
                for (const h of subH) {
                    for (let j = 1; j <= Math.min(board.length, 3); j++) {
                        const subB = getSubsetsFixed(board, j);
                        for (const b of subB) { const res = evaluateMeldStructure([...h, ...b]); if (res.type !== 'invalid' && res.type !== 'Single') return true; }
                    }
                }
            }
            return false;
        }
        function getSubsetsFixed(arr, size) {
            const res = []; const recurse = (prefix, remaining) => { if (prefix.length === size) { res.push(prefix); return; } for (let i = 0; i < remaining.length; i++) { recurse([...prefix, remaining[i]], remaining.slice(i + 1)); } };
            recurse([], arr); return res;
        }

        function roundTermination(winner) {
            disableControls(); playBtn.classList.add('hidden'); passBtn.classList.add('hidden'); nextRoundBtn.classList.remove('hidden');
            const isUser = (winner === 'player'); addToLog(`--- Cycle Concluded: ${isUser ? 'Victory Achieved' : 'Defeat Incurred'} ---`);
            if (isUser) { playerScore++; addToLog(`Rival retained cards:`, computerHand); } else { computerScore++; addToLog(`You retained cards:`, playerHand); }
            lastRoundWinner = winner; renderAll(); updateStatus(`${isUser ? 'You claimed the match cycle!' : 'Rival asserted dominance.'}`);
            nextRoundBtn.textContent = (playerScore >= 2 || computerScore >= 2) ? 'Initiate New Match' : 'Next Cycle';
        }

        playBtn.addEventListener('click', playTurn); passBtn.addEventListener('click', passTurn);
        nextRoundBtn.addEventListener('click', () => (playerScore >= 2 || computerScore >= 2) ? startGame() : startRound()); restartBtn.addEventListener('click', startGame);
        document.getElementById('play-log-helper-btn').addEventListener('click', () => document.body.classList.add('log-open'));
        document.getElementById('close-log-btn').addEventListener('click', () => document.body.classList.remove('log-open'));
        
        gameTitleElem.addEventListener('click', () => {
            titleClickCount++;
            if (titleClickCount >= 5) {
                launchFlyingBoxArt();
                titleClickCount = 0;
            }
            setTimeout(() => { if (titleClickCount > 0) titleClickCount = 0; }, 3000);
        });

        startGame();
    </script>
